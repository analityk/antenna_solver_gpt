[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antenna-solver-gpt"
version = "0.1.0"
description = "Parametric antenna geometry and openEMS integration"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "matplotlib>=3.9", "jsonschema>=4.22"]

[project.scripts]
antenna-lab = "antenna_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
